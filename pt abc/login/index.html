<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <link rel="stylesheet" href="style.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

  <!-- Splash screen -->
  <div id="splash" role="status" aria-label="Loading">
    <div class="splash-content">
      <div class="splash-logo" aria-hidden="true">
        <img src="../icon.jpg" alt="MyApp logo" class="splash-img">
      </div>
      <div class="splash-title">PT ABC</div>
    </div>
  </div>

  <div class="app" aria-hidden="true">
      <div class="container">
            <!-- Login -->
          <div class="form-box login">
              <form action="#">
                  <h1>Login</h1>
                  <div class="input-box">
                      <input type="text" placeholder="Email" required>
                      <i class='bx bxs-user'></i>
                  </div>
                  <div class="input-box">
                      <input type="password" placeholder="Password" required>
                      <i class='bx bxs-lock-alt' ></i>
                  </div>

                  <div class="form-actions">
                      <div class="forgot-link">
                          <a href="#">Forgot Password?</a>
                      </div>
                      <div class="register">
                          <p>Don't have an account? <a href="#">Register</a></p>
                      </div>
                  </div>
                  <button type="submit" class="btn">Login</button>
                  <p>or login with social platforms</p>
                  <div class="social-icons">
                      <a href="#"><i class='bx bxl-google' ></i></a>
                      <a href="#"><i class='bx bxl-facebook' ></i></a>
                      <a href="#"><i class='bx bxl-apple' ></i></a>
                  </div>
              </form>
          </div>
            <!-- Register -->
          <div class="form-box register">
              <form action="#">
                  <h1>Registration</h1>
                  <div class="input-box">
                      <input type="text" placeholder="Nomor Hp" required>
                      <i class='bx bxs-user'></i>
                  </div>
                  <div class="input-box">
                      <input type="email" placeholder="Email" required>
                      <i class='bx bxs-envelope' ></i>
                  </div>
                  <div class="input-box">
                      <input type="password" placeholder="Password" required>
                      <i class='bx bxs-lock-alt' ></i>
                  </div>

                  <div class="form-actions">
                      <div class="login">
                          <p>Already have an account? <a href="#">Login</a></p>
                      </div>
                  </div>

                  <button type="submit" class="btn">Register</button>
                  <p>or register with social platforms</p>
                  <div class="social-icons">
                      <a href="#"><i class='bx bxl-google' ></i></a>
                      <a href="#"><i class='bx bxl-facebook' ></i></a>
                      <a href="#"><i class='bx bxl-apple' ></i></a>
                  </div>
              </form>
          </div>

      </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
