<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>E-ticket</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../dashboard/dashboard.css">
  <link rel="stylesheet" href="boarding.css">
</head>

<body>
  <header class="topbar">
    <div class="brand">PT. ABC</div>
    <div class="user-info">
      <div class="user-name" id="userName">tes123</div>
      <div class="user-category" id="userCategory">Penumpang</div>
    </div>
  </header>

  <main class="content boarding-content">
    <div class="breadcrumb">Home / E-ticket</div>

    <!-- Boarding Pass -->
    <section class="boarding-pass">
      <div class="bp-left">
        <h2>Kode Booking</h2>
        <div class="booking-code">BTK-9X7Z-2026</div>

        <h3>Detail Perjalanan</h3>
        <div class="info-row"><span class="label">Rute</span><span class="value">Jakarta → Bandung</span></div>
        <div class="info-row"><span class="label">Tanggal</span><span class="value">2026-02-14</span></div>
        <div class="info-row"><span class="label">Waktu</span><span class="value">08:00 - 3 jam</span></div>
        <div class="info-row"><span class="label">Armada</span><span class="value">MegaBus</span></div>
        <div class="info-row"><span class="label">Penumpang</span><span class="value">2</span></div>
        <div class="info-row"><span class="label">Nomor Kursi</span><span class="value">2A, 2B</span></div>

        <div class="actions" style="margin-top:12px;">
          <a class="btn primary" href="#" download="eticket.png" id="downloadBtn">Download E-ticket</a>
          <a class="btn" href="../dashboard/dashboard.html">Selesai</a>
        </div>
      </div>

      <!-- e-ticket -->
      <div class="bp-right">
        <div class="qr-wrap">
          <img width="200" height="200" viewBox="0 0 64 64" src="image.png" alt="MyApp logo" class="qr">
        </div>

        <div class="ticket-preview">
          <h4>E-ticket</h4>
          <div class="tp-row"><span class="label">Nama</span><span class="value">Rifky</span></div>
          <div class="tp-row"><span class="label">Rute</span><span class="value">Jakarta → Bandung</span></div>
          <div class="tp-row"><span class="label">Kursi</span><span class="value">2A, 2B</span></div>
          <div class="tp-row"><span class="label">Kode</span><span class="value">BTK-9X7Z-2026</span></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
